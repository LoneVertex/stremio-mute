name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    name: Require Successful CI for Tagged Commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify CI Success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          success_count=$(gh api --method GET "repos/${TARGET_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&status=completed" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${TARGET_SHA}\" and .name == \"CI\" and .conclusion == \"success\")] | length")
          if [ "${success_count}" -lt 1 ]; then
            echo "No successful CI run exists for ${TARGET_SHA}; refusing to publish a release."
            exit 1
          fi
          echo "Successful CI run found for ${TARGET_SHA}."

  release:
    name: Build & Publish Release Assets
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate Release Tag Matches VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          expected_tag="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match VERSION ${version} (expected ${expected_tag})."
            exit 1
          fi

      - name: Validate Test Suite Before Packaging
        run: |
          chmod +x scripts/*.sh tests/**/*.sh
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 shellcheck
          bash tests/static/test_syntax.sh
          bash tests/compatibility/test_compatibility_fixtures.sh
          bash tests/static/test_absolute_path.sh
          bash tests/static/test_controller_version.sh
          bash tests/static/test_stale_process_install.sh
          bash tests/integration/test_install_rollback.sh
          bash scripts/repo-audit.sh

      - name: Package Release
        run: |
          bash scripts/package.sh
          cp dist/SHA256SUMS /tmp/stremio-mute-first-SHA256SUMS
          bash scripts/package.sh
          cmp -s /tmp/stremio-mute-first-SHA256SUMS dist/SHA256SUMS

      - name: Verify Release Archives and Checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tar -tzf stremio-mute-v*.tar.gz | grep -E '^stremio-mute-v[^/]*/README\.md$' >/dev/null
          unzip -Z1 stremio-mute-v*.zip | grep -E '^stremio-mute-v[^/]*/README\.md$' >/dev/null
          tar -tzf stremio-mute-v*.tar.gz | grep -E '^stremio-mute-v[^/]*/scripts/runtime-path\.sh$' >/dev/null
          unzip -Z1 stremio-mute-v*.zip | grep -E '^stremio-mute-v[^/]*/scripts/runtime-path\.sh$' >/dev/null
          for required in FAQ.md SUPPORT.md THIRD-PARTY.md VERSIONING.md CODE_OF_CONDUCT.md; do
            tar -tzf stremio-mute-v*.tar.gz | grep -E "^stremio-mute-v[^/]*/${required}$" >/dev/null
            unzip -Z1 stremio-mute-v*.zip | grep -E "^stremio-mute-v[^/]*/${required}$" >/dev/null
          done
          if tar -tzf stremio-mute-v*.tar.gz | grep -E '(^|/)(\.git|.*\.log|.*\.swp|credentials|private_key|secret)' ; then exit 1; fi
          if unzip -Z1 stremio-mute-v*.zip | grep -E '(^|/)(\.git|.*\.log|.*\.swp|credentials|private_key|secret)' ; then exit 1; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
