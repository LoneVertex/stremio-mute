name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Syntax, Compatibility, Lifecycle & Packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Run Static Syntax Tests
        run: bash tests/static/test_syntax.sh

      - name: Run Compatibility Fixture Tests
        run: bash tests/compatibility/test_compatibility_fixtures.sh

      - name: Run Absolute-Path and Lifecycle Regression Tests
        run: bash tests/static/test_absolute_path.sh

      - name: Run Controller Version Provenance Tests
        run: bash tests/static/test_controller_version.sh

      - name: Run Stale-Process Deployment Regression
        run: bash tests/static/test_stale_process_install.sh

      - name: Run Install Rollback Reinstall Lifecycle
        run: bash tests/integration/test_install_rollback.sh

      - name: Run Repository Hygiene Auditor
        run: bash scripts/repo-audit.sh

      - name: Build and Validate Release Archives
        run: |
          bash scripts/package.sh
          cp dist/SHA256SUMS /tmp/stremio-mute-first-SHA256SUMS
          bash scripts/package.sh
          cmp -s /tmp/stremio-mute-first-SHA256SUMS dist/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS
          tar -tzf stremio-mute-v*.tar.gz | grep -E '^stremio-mute-v[^/]*/README\.md$' >/dev/null
          unzip -Z1 stremio-mute-v*.zip | grep -E '^stremio-mute-v[^/]*/README\.md$' >/dev/null
          tar -tzf stremio-mute-v*.tar.gz | grep -E '^stremio-mute-v[^/]*/scripts/runtime-path\.sh$' >/dev/null
          unzip -Z1 stremio-mute-v*.zip | grep -E '^stremio-mute-v[^/]*/scripts/runtime-path\.sh$' >/dev/null
          for required in FAQ.md SUPPORT.md THIRD-PARTY.md VERSIONING.md CODE_OF_CONDUCT.md; do
            tar -tzf stremio-mute-v*.tar.gz | grep -E "^stremio-mute-v[^/]*/${required}$" >/dev/null
            unzip -Z1 stremio-mute-v*.zip | grep -E "^stremio-mute-v[^/]*/${required}$" >/dev/null
          done
          if tar -tzf stremio-mute-v*.tar.gz | grep -E '(^|/)(\.git|.*\.log|.*\.swp|credentials|private_key|secret)' ; then exit 1; fi
          if unzip -Z1 stremio-mute-v*.zip | grep -E '(^|/)(\.git|.*\.log|.*\.swp|credentials|private_key|secret)' ; then exit 1; fi
