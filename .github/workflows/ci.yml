name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Lint, Syntax, Fixtures & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find scripts tests -name "*.sh" | xargs shellcheck

      - name: Run Static Syntax Tests
        run: |
          bash tests/static/test_syntax.sh

      - name: Run Compatibility Fixture Tests
        run: |
          bash tests/compatibility/test_compatibility_fixtures.sh

      - name: Run Repository Hygiene Auditor
        run: |
          bash scripts/repo-audit.sh
